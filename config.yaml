# Tunables for batch matching (no secrets). Paths are resolved relative to repo root.

paths:
  input_jsonl: data/sample/shows.jsonl
  offline_catalog_sample: data/sample/offline_vendor.json
  output_dir: outputs
  results_db: outputs/results.db
  audit_db: outputs/audit.db
  matched_csv: outputs/matched_results.csv
  matched_json: outputs/matched_results.json
  stats_json: outputs/stats_summary.json

sqlite:
  use_wal: true

checkpointing:
  frequency_shows: 50

http_client:
  base_delay_seconds: 1.3
  request_timeout_seconds: 10
  max_retries: 3

circuit_breaker:
  max_consecutive_503s: 25
  max_consecutive_network_errors: 10
  early_warning_threshold: 15
  pause_duration_seconds: 1800

matching:
  show_similarity_threshold_percent: 90
  parent_similarity_threshold_percent: 85
  episode_fuzzy_high_percent: 95
  episode_fuzzy_medium_percent: 85
  date_tolerance_days: 2

show_validation:
  max_recursion_depth: 3
  reject_catalog_series_start_year_after: 2020
  keyword_coverage_minimum: 0.7
  coverage_fallback_similarity_percent: 95
  explicit_podcast_page_score: 10
  podcast_like_pass_minimum_score: 3
  large_cast_minimum_credit_links: 5
  large_cast_score_penalty: 2
  genre_keyword_boost: 1
  false_positive_risk_high_below_score: 3
  false_positive_risk_medium_below_score: 10
  reject_validation_below_podcast_score: 0
  scoring:
    description_podcast_word: 3
    description_episode_word: 2
    description_hosted_presented: 2
    description_weekly_daily: 1
    description_guests: 1

logging:
  level: INFO
